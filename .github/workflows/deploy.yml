name: Deploy site

# NOTE: written but not yet run on GitHub. Pages must be set to "GitHub Actions" (Settings -> Pages -> Source).
on:
  push:
    branches: [main]
  workflow_dispatch:
  # The download page shows the latest GitHub release, read at build time, so rebuild daily to keep it current.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
