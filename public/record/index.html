<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Voice test recorder</title>
<style>
:root{--bg:#fafaf8;--fg:#1c1c1a;--muted:#6b6b66;--card:#fff;--line:#dcdcd6;--accent:#2b5fd9;--accent-fg:#fff;--ok:#2f8f4e;--warn:#c27a00;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ececea;--muted:#9a9a94;--card:#1f1f1d;--line:#34342f;--accent:#6b97ff;--accent-fg:#101010;--ok:#4cc27a;--warn:#e6a23c;--bad:#ef6b5b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
h1{font-size:1.25rem;margin:0}h2{font-size:1.05rem;margin:1.2em 0 .3em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.consent{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 12px;background:var(--bg)}
.consent p{margin:.5em 0}
button,select{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 14px;cursor:pointer;min-height:44px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.rec.on{background:var(--bad);border-color:var(--bad);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:block;margin:.4em 0}
.field{display:grid;gap:4px;margin:10px 0}.field select{padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);min-height:44px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.muted{color:var(--muted);font-size:.9rem}
.sentence{font-size:1.7rem;line-height:1.5;margin:.4em 0 .6em;word-break:break-word}
.meter{height:14px;background:var(--bg);border:1px solid var(--line);border-radius:7px;overflow:hidden;position:relative}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .05s linear}
.meter.quiet i{background:var(--warn)}.meter.clip i{background:var(--bad)}
.status{min-height:1.5em;margin-top:6px;font-size:.95rem}.status.warn{color:var(--warn)}.status.bad{color:var(--bad)}.status.ok{color:var(--ok)}
progress{width:100%;height:8px}
pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><h1 id="title"></h1><button id="langBtn" type="button" aria-label="Language"></button></header>
<p class="muted" id="subtitle"></p>

<section id="consent" class="card">
 <h2 id="consentH"></h2>
 <div class="consent" id="consentText" tabindex="0"></div>
 <h2 id="licH"></h2>
 <label><input type="radio" name="lic" value="A"> <span id="licA"></span></label>
 <label><input type="radio" name="lic" value="B"> <span id="licB"></span></label>
 <label><input type="checkbox" id="age"> <span id="ageL"></span></label>
 <h2 id="metaH"></h2>
 <div class="field"><label for="region" id="regionL"></label><select id="region"></select></div>
 <div class="field"><label for="mic" id="micL"></label><select id="mic"></select></div>
 <div class="field"><label for="gender" id="genderL"></label><select id="gender"></select></div>
 <div class="field"><label for="ageband" id="agebandL"></label><select id="ageband"></select></div>
 <div class="row"><button id="startBtn" class="primary" type="button" disabled></button></div>
 <p class="status bad" id="startErr" role="alert"></p>
</section>

<section id="rec" class="card" hidden>
 <progress id="prog" value="0" max="1"></progress>
 <div class="muted" id="progText"></div>
 <div class="muted" id="sid"></div>
 <div class="sentence" id="sentence" lang="zh-CN"></div>
 <div class="meter" id="meter" role="meter" aria-label="Level" aria-valuemin="0" aria-valuemax="100"><i id="meterBar"></i></div>
 <div class="status" id="recStatus" role="status" aria-live="polite"></div>
 <div class="row">
  <button id="recBtn" class="rec primary" type="button"></button>
  <button id="playBtn" type="button"></button>
  <button id="skipBtn" type="button"></button>
 </div>
 <div class="row">
  <button id="prevBtn" type="button"></button>
  <button id="nextBtn" type="button"></button>
  <button id="finishBtn" type="button"></button>
 </div>
 <p class="muted" id="hint"></p>
</section>

<section id="fin" class="card" hidden>
 <h2 id="finH"></h2>
 <p id="finSummary"></p>
 <div class="row"><button id="zipBtn" class="primary" type="button"></button><button id="backBtn" type="button"></button></div>
 <p class="status" id="zipStatus" role="status" aria-live="polite"></p>
 <h2 id="subH"></h2>
 <div id="subText"></div>
</section>
</main>

 quiet:'声音太小。请靠近麦克风或大声一点，然后重录。',
 clip:'声音太大（爆音）。请稍微离远一点或调低输入音量，然后重录。',
 short:'录音很短。如果漏了一部分，请重录。',
 good:'音量合适。',skipped:'已跳过。',
 finH:'录完了',
 finSummary:(r,s,n)=>`已录 ${r} 句，跳过 ${s} 句，未录 ${n-r-s} 句。`,
 zip:'下载 zip',back:'回去继续录',zipBusy:'正在打包……',zipDone:n=>`已下载 ${n}。在你发出之前请保留它。`,
 noRec:'请先至少录一句。',
 subH:'怎么提交',
 submit:(pid,name)=>[
  'zip 里有每个已录句子的 WAV 文件、manifest.json、consent.json 和一份简短说明。你的参与编号是 '+pid+'。',
  '方式一（推荐）：把 zip 文件（'+name+'，每 30 句约 1 MB）发邮件到 '+CONTACT+'。',
  HF_URL.includes('{{')?null:'方式二（仅授权 A）：在数据集页面 '+HF_URL+' 以 pull request 的方式上传。公开数据集上 pull request 的内容可能被其他人看到，所以选 B 的请不要走这条路。',
  '以后想删除数据，发邮件到 '+CONTACT+'，附上你的参与编号。'],
 leave:'你还有没下载的录音。'
}};

/* ---------- state ---------- */
const S={lang:(navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en',pid:null,idx:0,rec:{},consentAt:null,
 stream:null,ctx:null,proc:null,analyser:null,chunks:[],capturing:false,recPeak:0,player:null,downloaded:false,zipUrl:null};
const t=()=>T[S.lang];
const sents=SCRIPT.sentences;

function fill(sel,items,withPns){const keep=sel.value;sel.textContent='';
 const o0=document.createElement('option');o0.value='';o0.textContent='—';sel.appendChild(o0);
 items.forEach((x,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=x;sel.appendChild(o)});
 if(withPns){const o=document.createElement('option');o.value='pns';o.textContent=t().pns;sel.appendChild(o)}
 sel.value=keep}
function renderText(){
 const L=t();document.documentElement.lang=S.lang==='zh'?'zh-CN':'en';
 document.title=L.title+' · '+L.name;$('title').textContent=L.title+' · '+L.name;
 $('langBtn').textContent=S.lang==='zh'?'English':'简体中文';$('subtitle').textContent=L.subtitle;
 $('consentH').textContent=L.consentH;$('licH').textContent=L.licH;$('licA').textContent=L.licA;$('licB').textContent=L.licB;
 $('ageL').textContent=L.ageL;$('metaH').textContent=L.metaH;$('regionL').textContent=L.regionL;$('micL').textContent=L.micL;
 $('genderL').textContent=L.genderL;$('agebandL').textContent=L.agebandL;$('startBtn').textContent=L.start;
 fill($('region'),L.regions,true);fill($('mic'),L.mics,true);fill($('gender'),L.genders,true);fill($('ageband'),L.ages,true);
 const c=$('consentText');c.textContent='';
 L.consent.forEach(([h,p])=>{const e=document.createElement('p');const b=document.createElement('strong');b.textContent=h;e.appendChild(b);e.appendChild(document.createElement('br'));e.appendChild(document.createTextNode(p));c.appendChild(e)});
 $('recBtn').textContent=S.capturing?L.stop:(S.rec[sents[S.idx].id]&&S.rec[sents[S.idx].id].pcm?L.rerec:L.rec);
 $('playBtn').textContent=S.player&&!S.player.paused?L.stopPlay:L.play;
 $('skipBtn').textContent=L.skip;$('prevBtn').textContent=L.prev;$('nextBtn').textContent=L.next;$('finishBtn').textContent=L.finish;
 $('hint').textContent=L.hint;$('finH').textContent=L.finH;$('zipBtn').textContent=L.zip;$('backBtn').textContent=L.back;$('subH').textContent=L.subH;
 checkStart();if(!$('rec').hidden)renderSentence();if(!$('fin').hidden)renderFinish();
}
function lic(){const r=document.querySelector('input[name=lic]:checked');return r?r.value:''}
function checkStart(){const ok=lic()&&$('age').checked&&$('region').value&&$('mic').value;$('startBtn').disabled=!ok;$('startErr').textContent=ok?'':'';$('startBtn').title=ok?'':t().needAll}
['change','input'].forEach(ev=>$('consent').addEventListener(ev,checkStart));
$('langBtn').onclick=()=>{S.lang=S.lang==='zh'?'en':'zh';renderText()};

/* ---------- audio ---------- */
function counts(){let r=0,s=0;for(const k in S.rec){if(S.rec[k].pcm)r++;else if(S.rec[k].skipped)s++}return[r,s]}
async function ensureMic(){
 if(S.stream)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.isSecureContext)throw new Error('insecure');
 S.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
 const AC=window.AudioContext||window.webkitAudioContext;S.ctx=new AC();
 const src=S.ctx.createMediaStreamSource(S.stream);
 S.analyser=S.ctx.createAnalyser();S.analyser.fftSize=1024;src.connect(S.analyser);
 S.proc=S.ctx.createScriptProcessor(4096,1,1);
 S.proc.onaudioprocess=e=>{if(!S.capturing)return;const d=e.inputBuffer.getChannelData(0);S.chunks.push(new Float32Array(d))};
 const mute=S.ctx.createGain();mute.gain.value=0;src.connect(S.proc);S.proc.connect(mute);mute.connect(S.ctx.destination);
 requestAnimationFrame(meterLoop);
}
const buf=new Float32Array(1024);
function meterLoop(){
 if(!S.analyser)return;S.analyser.getFloatTimeDomainData(buf);let p=0;for(let i=0;i<buf.length;i++){const a=Math.abs(buf[i]);if(a>p)p=a}
 if(S.capturing&&p>S.recPeak)S.recPeak=p;
 const m=$('meter');$('meterBar').style.width=Math.min(100,Math.round(p*100))+'%';m.setAttribute('aria-valuenow',String(Math.round(p*100)));
 m.classList.toggle('clip',p>=0.98);m.classList.toggle('quiet',S.capturing&&S.recPeak<0.1&&p<0.1);
 requestAnimationFrame(meterLoop);
}
function resample(f,from,to){
 if(from===to)return f;const r=from/to,n=Math.floor(f.length/r),o=new Float32Array(n);
 for(let i=0;i<n;i++){const s=i*r,e=s+r,a=Math.floor(s),b=Math.min(Math.ceil(e),f.length);let sum=0,w=0;
  for(let j=a;j<b;j++){const ov=Math.min(e,j+1)-Math.max(s,j);if(ov>0){sum+=f[j]*ov;w+=ov}}o[i]=w?sum/w:0}
 return o}
function setStatus(msg,cls){const e=$('recStatus');e.textContent=msg;e.className='status '+(cls||'')}
async function toggleRec(){
 const id=sents[S.idx].id;
 if(!S.capturing){
  stopPlay();
  try{await ensureMic()}catch(err){setStatus(err&&err.message==='insecure'?t().micInsecure:t().micDenied,'bad');return}
  if(S.ctx.state==='suspended')await S.ctx.resume();
  S.chunks=[];S.recPeak=0;S.capturing=true;setStatus(t().recording,'');$('recBtn').classList.add('on');renderButtons();
 }else{
  S.capturing=false;$('recBtn').classList.remove('on');
  let n=0;S.chunks.forEach(c=>n+=c.length);const all=new Float32Array(n);let o=0;S.chunks.forEach(c=>{all.set(c,o);o+=c.length});S.chunks=[];
  const f=resample(all,S.ctx.sampleRate,RATE);let peak=0,clipN=0;const pcm=new Int16Array(f.length);
  for(let i=0;i<f.length;i++){let v=f[i];const a=Math.abs(v);if(a>peak)peak=a;if(a>=0.999)clipN++;v=Math.max(-1,Math.min(1,v));pcm[i]=v<0?Math.round(v*32768):Math.round(v*32767)}
  const prev=S.rec[id];
  S.rec[id]={pcm,peak:Math.max(peak,0),clipped:clipN>3,takes:(prev&&prev.takes||0)+1,dur:pcm.length/RATE,rate:S.ctx.sampleRate};
  judge(S.rec[id]);renderSentence();
 }
}
function judge(r){const L=t();
 if(r.clipped)setStatus(L.clip,'bad');else if(r.peak<0.1)setStatus(L.quiet,'warn');else if(r.dur<0.4)setStatus(L.short,'warn');else setStatus(L.good,'ok')}
function wavBytes(pcm){
 const n=pcm.length,b=new ArrayBuffer(44+n*2),v=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
 v.setUint32(24,RATE,true);v.setUint32(28,RATE*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 new Int16Array(b,44,n).set(pcm);return new Uint8Array(b)}
function stopPlay(){if(S.player){S.player.pause();URL.revokeObjectURL(S.player.src);S.player=null}$('playBtn').textContent=t().play}
function togglePlay(){
 if(S.player){stopPlay();return}
 const r=S.rec[sents[S.idx].id];if(!r||!r.pcm)return;
 const url=URL.createObjectURL(new Blob([wavBytes(r.pcm)],{type:'audio/wav'}));const a=new Audio(url);S.player=a;
 a.onended=()=>stopPlay();a.play().catch(()=>stopPlay());$('playBtn').textContent=t().stopPlay}

/* ---------- sentence screen ---------- */
function renderButtons(){
 const s=sents[S.idx],r=S.rec[s.id],has=!!(r&&r.pcm);const L=t();
 $('recBtn').textContent=S.capturing?L.stop:(has?L.rerec:L.rec);
 $('playBtn').disabled=!has||S.capturing;$('skipBtn').disabled=S.capturing;
 $('prevBtn').disabled=S.idx===0||S.capturing;$('nextBtn').disabled=S.capturing||!(has||(r&&r.skipped));
 $('nextBtn').textContent=S.idx===sents.length-1?L.finish:L.next;
 $('finishBtn').disabled=S.capturing||counts()[0]===0;
}
function renderSentence(){
 const s=sents[S.idx],[rc,sk]=counts();stopPlay();
 $('prog').max=sents.length;$('prog').value=rc+sk;$('progText').textContent=t().progText(rc,sk,sents.length);
 $('sid').textContent=`${s.id} · ${S.idx+1}/${sents.length}`;$('sentence').textContent=s.reference;
 const r=S.rec[s.id];
 if(r&&r.pcm)judge(r);else if(r&&r.skipped)setStatus(t().skipped,'');else setStatus(S.stream?'':t().mic0,'');
 renderButtons();
}
function go(i){if(S.capturing)return;if(i>=sents.length){showFinish();return}S.idx=Math.max(0,i);renderSentence()}
$('recBtn').onclick=toggleRec;$('playBtn').onclick=togglePlay;
$('skipBtn').onclick=()=>{const id=sents[S.idx].id;S.rec[id]={skipped:true,takes:(S.rec[id]&&S.rec[id].takes)||0};go(S.idx+1)};
$('prevBtn').onclick=()=>go(S.idx-1);$('nextBtn').onclick=()=>go(S.idx+1);$('finishBtn').onclick=showFinish;
document.addEventListener('keydown',e=>{
 if(e.code!=='Space'||$('rec').hidden||e.repeat)return;const tg=e.target.tagName;if(tg==='SELECT'||tg==='INPUT'||tg==='TEXTAREA')return;
 e.preventDefault();toggleRec()});
$('startBtn').onclick=()=>{
 S.consentAt=new Date().toISOString();S.pid='p-'+Array.from(crypto.getRandomValues(new Uint8Array(4)),b=>b.toString(16).padStart(2,'0')).join('');
 $('consent').hidden=true;$('rec').hidden=false;S.idx=0;renderSentence();window.scrollTo(0,0)};

/* ---------- zip ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(files){
 const enc=new TextEncoder(),now=new Date(),dt=((now.getFullYear()-1980)<<9|(now.getMonth()+1)<<5|now.getDate())&0xFFFF,tm=(now.getHours()<<11|now.getMinutes()<<5|(now.getSeconds()>>1))&0xFFFF;
 const parts=[],central=[];let off=0;
 for(const f of files){
  const name=enc.encode(f.name),crc=crc32(f.data),h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);
  h.setUint32(14,crc,true);h.setUint32(18,f.data.length,true);h.setUint32(22,f.data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
  parts.push(new Uint8Array(h.buffer),name,f.data);
  const c=new DataView(new ArrayBuffer(46));
  c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);
  c.setUint32(16,crc,true);c.setUint32(20,f.data.length,true);c.setUint32(24,f.data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
  central.push(new Uint8Array(c.buffer),name);off+=30+name.length+f.data.length}
 let cs=0;central.forEach(x=>cs+=x.length);
 const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:'application/zip'})}
function buildZip(){
 const enc=new TextEncoder(),root='cadenza-testset-'+S.pid,json=o=>enc.encode(JSON.stringify(o,null,2)+'\n'),files=[];
 const items=sents.map(s=>{const r=S.rec[s.id];
  const base={id:s.id,category:s.category,reference:s.reference};
  if(r&&r.pcm){files.push({name:`${root}/wav/${s.id}.wav`,data:wavBytes(r.pcm)});
   return{...base,status:'recorded',file:`wav/${s.id}.wav`,duration_s:Math.round(r.dur*1000)/1000,peak:Math.round(r.peak*1000)/1000,clipped:r.clipped,takes:r.takes}}
  return{...base,status:r&&r.skipped?'skipped':'not_recorded',file:null,duration_s:null,takes:r?r.takes||0:0}});
 const trk=S.stream&&S.stream.getAudioTracks()[0],set=trk&&trk.getSettings?trk.getSettings():{};
 const consentText=t().consent.map(x=>x[0]+'\n'+x[1]).join('\n\n');
 const consent={consent_version:CONSENT_VERSION,option:lic(),accepted_at:S.consentAt,ui_language:S.lang,confirmed_18_plus_alone:true,text_shown:consentText};
 const L=T[S.lang];const pick=(id,list)=>{const v=$(id).value;return v===''?null:(v==='pns'?'prefer_not_to_say':list[+v])};
 const manifest={schema_version:1,recorder_version:RECORDER_VERSION,script_version:SCRIPT.version,script_language:SCRIPT.language,participant_id:S.pid,created_at:new Date().toISOString(),
  consent_option:lic(),consent_version:CONSENT_VERSION,
  meta:{accent_region:pick('region',T.en.regions),microphone_type:pick('mic',T.en.mics),gender:pick('gender',T.en.genders),age_range:pick('ageband',T.en.ages)},
  audio:{sample_rate:RATE,channels:1,format:'wav_pcm_s16le',capture_sample_rate:S.ctx?S.ctx.sampleRate:null,
   echo_cancellation:set.echoCancellation!==undefined?set.echoCancellation:null,noise_suppression:set.noiseSuppression!==undefined?set.noiseSuppression:null,auto_gain_control:set.autoGainControl!==undefined?set.autoGainControl:null},
  items};
 files.push({name:`${root}/manifest.json`,data:json(manifest)},{name:`${root}/consent.json`,data:json(consent)},
  {name:`${root}/README.txt`,data:enc.encode(`Cadenza voice test set submission\nParticipant ID: ${S.pid}\nConsent option: ${lic()} (version ${CONSENT_VERSION})\nSend this zip file as described on the recorder page. Delete requests: ${CONTACT}\n`)});
 return{blob:makeZip(files),name:root+'.zip'}}

function showFinish(){if(S.capturing)return;stopPlay();$('rec').hidden=true;$('fin').hidden=false;renderFinish();window.scrollTo(0,0)}
function renderFinish(){const[rc,sk]=counts();$('finSummary').textContent=t().finSummary(rc,sk,sents.length);$('zipBtn').disabled=rc===0;
 const box=$('subText');box.textContent='';t().submit(S.pid,'cadenza-testset-'+S.pid+'.zip').filter(Boolean).forEach(x=>{const p=document.createElement('p');p.textContent=x;box.appendChild(p)})}
$('backBtn').onclick=()=>{$('fin').hidden=true;$('rec').hidden=false;renderSentence()};
$('zipBtn').onclick=()=>{
 if(counts()[0]===0){$('zipStatus').textContent=t().noRec;return}
 $('zipStatus').textContent=t().zipBusy;
 setTimeout(()=>{const z=buildZip();if(S.zipUrl)URL.revokeObjectURL(S.zipUrl);S.zipUrl=URL.createObjectURL(z.blob);
  const a=document.createElement('a');a.href=S.zipUrl;a.download=z.name;document.body.appendChild(a);a.click();a.remove();
  S.downloaded=true;$('zipStatus').textContent=t().zipDone(z.name);window.__lastZip=z},20)};
window.addEventListener('beforeunload',e=>{if(counts()[0]>0&&!S.downloaded){e.preventDefault();e.returnValue=''}});
renderText();
</script>
</body>
</html>
